name: farmora
description: A simple marketplace connecting farmers, buyers, and transport providers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  http: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  intl: any
  # Sri Lankan locale support
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.0.0
  cloud_functions: ^6.0.0
  firebase_messaging: ^16.0.0
  file_picker: ^8.3.7
  image_picker: ^1.1.2
  image_picker_platform_interface: ^2.11.1
  mobile_scanner: ^7.4.0
  video_player: ^2.7.0
  qr_flutter: ^4.1.0
  google_sign_in: ^6.2.1
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4
  firebase_app_check: ^0.4.1+4
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.2
  firebase_crashlytics: ^5.4.0
  shared_preferences: ^2.5.5
  firebase_performance: ^0.11.6
  firebase_analytics: ^12.6.0
  logger: ^2.8.0
  cached_network_image: ^3.4.1
  fl_chart: ^1.2.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  fake_cloud_firestore: ^4.3.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    # Font licence (the TTFs themselves are bundled through `fonts:` below).
    - assets/fonts/OFL.txt

  # Noto Sans Tamil / Sinhala (SIL OFL 1.1, see assets/fonts/OFL.txt) are the
  # fallback fonts for Tamil and Sinhala text; required on web, where the
  # browser does not supply them.
  fonts:
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansTamil-Bold.ttf
          weight: 700
    - family: NotoSansSinhala
      fonts:
        - asset: assets/fonts/NotoSansSinhala-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSinhala-Bold.ttf
          weight: 700
