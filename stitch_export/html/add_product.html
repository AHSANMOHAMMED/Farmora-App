</div>
</div>
<div class="mb-md">

<option disabled="" selected="" value="">Select a category</option>
<option value="vegetables">Vegetables</option>
<option value="fruits">Fruits</option>
<option value="grains">Grains</option>
<option value="dairy">Dairy</option>

</div>
</div>

<div class="flex gap-md mb-lg">
<div class="flex-1">

<input class="w-full h-[56px] px-md rounded-lg bg-surface text-on-surface border border-outline-variant focus:outline-none focus:border-primary focus:border-2 transition-colors placeholder:text-on-surface-variant/50" id="quantity" placeholder="0.00" type="number"/>
</div>
<div class="w-1/3">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="unit">Unit</label>
<div class="relative">
<select class="w-full h-[56px] px-md pr-10 rounded-lg bg-surface text-on-surface border border-outline-variant focus:outline-none focus:border-primary focus:border-2 transition-colors appearance-none" id="unit">

<option value="lbs">lbs</option>
<option value="pieces">pcs</option>
<option value="boxes">box</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
</div>
<div class="mb-lg">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="price">Price per unit</label>
<div class="relative">
<span class="absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant">$</span>
<input class="w-full h-[56px] pl-[36px] pr-md rounded-lg bg-surface text-on-surface border border-outline-variant focus:outline-none focus:border-primary focus:border-2 transition-colors placeholder:text-on-surface-variant/50" id="price" placeholder="0.00" type="number"/>
</div>
</div>
<div>

</div>
</div>

</div>
