<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Farmora - Agricultural Marketplace connecting farmers, buyers, and transport providers.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Farmora">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="favicon.png">

  <title>Farmora Marketplace</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #f7faf7;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* Loading spinner container */
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Animated spinner ring */
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e4f3e8;
      border-top: 4px solid #1f7a4d;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }

    /* Leaf pulsing in center */
    .spinner-leaf {
      position: absolute;
      width: 20px;
      height: 20px;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .spinner-wrapper {
      position: relative;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-text {
      color: #1f7a4d;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
      animation: fade-in 0.6s ease-out;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1); }
    }

    @keyframes fade-in {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Hide spinner once Flutter loads */
    .flutter-loaded .loading-container {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Branded loading spinner shown while Flutter bootstraps -->
  <div class="loading-container">
    <div class="spinner-wrapper">
      <div class="spinner"></div>
      <svg class="spinner-leaf" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 22C12 22 4 16 4 10C4 5 12 2 12 2C12 2 20 5 20 10C20 16 12 22 12 22Z" fill="#1f7a4d" opacity="0.85"/>
        <path d="M12 6L12 18" stroke="#f7faf7" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
        <path d="M12 10L8.5 13.5" stroke="#f7faf7" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
        <path d="M12 13L15.5 9.5" stroke="#f7faf7" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
      </svg>
    </div>
    <div class="brand-text">Farmora</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Hide spinner once Flutter engine signals ready
    window.addEventListener('flutter-first-frame', function() {
      document.body.classList.add('flutter-loaded');
    });
  </script>
</body>
</html>
