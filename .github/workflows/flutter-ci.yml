name: Flutter CI

on:
  push:
    branches:
      - main
      - suka
      - dev/swami
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Gradle memory
        run: echo "GRADLE_OPTS=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError" >> "$GITHUB_ENV"

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Build Cloud Functions
        working-directory: functions
        run: |
          npm ci
          npm run build

      - name: Create CI-only Android signing key
        run: |
          keytool -genkeypair -v \
            -keystore android/ci-upload-keystore.jks \
            -storepass ci-only-password \
            -keypass ci-only-password \
            -alias farmora \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Farmora CI, OU=CI, O=Farmora, L=Puttalam, ST=North Western, C=LK"
          printf '%s\n' \
            'storePassword=ci-only-password' \
            'keyPassword=ci-only-password' \
            'keyAlias=farmora' \
            'storeFile=../ci-upload-keystore.jks' > android/key.properties

      - name: Build APK
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs="-Xmx4G
            -XX:MaxMetaspaceSize=1G
            -XX:ReservedCodeCacheSize=256m
            -XX:+HeapDumpOnOutOfMemoryError"
        run: flutter build apk --release

      - name: Build Web
        run: flutter build web --release

      # Decide the deployment target once, so every later step agrees:
      #   live     -> pushes to main (production)
      #   preview  -> pushes to suka / dev/swami (branch preview channels)
      #   none     -> pull requests and other branches (build & test only)
      - name: Determine deploy channel
        id: deploy_channel
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "mode=live" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/suka" ] || [ "${{ github.ref }}" = "refs/heads/dev/swami" ]; then
            echo "mode=preview" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      # Fail fast (before wasting a deploy attempt) when the service account
      # secret required for hosting/functions deploys is missing on a branch
      # that is supposed to deploy.
      - name: Validate Firebase secrets
        if: steps.deploy_channel.outputs.mode != 'none'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FARMORA_1DA5A }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_FARMORA_1DA5A is not set in repository secrets; cannot deploy."
            exit 1
          fi

      - name: Deploy to Firebase Hosting (${{ steps.deploy_channel.outputs.mode }} channel)
        if: steps.deploy_channel.outputs.mode != 'none'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FARMORA_1DA5A }}
          projectId: farmora-1da5a
          channelId: ${{ steps.deploy_channel.outputs.mode }}

      # Full deploy of backend rules AND indexes AND cloud functions, but only
      # from main so feature branches never mutate production Firestore rules,
      # storage rules or functions. This step has NO continue-on-error: if the
      # backend deploy fails, the pipeline fails loudly instead of silently
      # shipping a frontend against stale rules.
      - name: Deploy Firestore rules/indexes, Storage rules & Functions via CLI
        if: steps.deploy_channel.outputs.mode == 'live'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FARMORA_1DA5A }}
        run: |
          npm install -g firebase-tools
          if [ -n "$FIREBASE_TOKEN" ]; then
            firebase deploy \
              --only firestore:rules,firestore:indexes,storage,functions:default \
              --token "$FIREBASE_TOKEN" \
              --project farmora-1da5a \
              --non-interactive
          else
            # No CI token: fall back to the ADC-style JSON service account.
            echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
            firebase deploy \
              --only firestore:rules,firestore:indexes,storage,functions:default \
              --project farmora-1da5a \
              --non-interactive
          fi
