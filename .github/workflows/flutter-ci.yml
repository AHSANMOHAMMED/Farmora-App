name: Flutter CI

on:
  push:
    branches:
      - main
      - suka
      - dev/swami
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Gradle memory
        run: echo "GRADLE_OPTS=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError" >> "$GITHUB_ENV"

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build Cloud Functions
        working-directory: functions
        run: |
          npm ci
          npm run build

      - name: Create CI-only Android signing key
        run: |
          keytool -genkeypair -v \
            -keystore android/ci-upload-keystore.jks \
            -storepass ci-only-password \
            -keypass ci-only-password \
            -alias farmora \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Farmora CI, OU=CI, O=Farmora, L=Puttalam, ST=North Western, C=LK"
          printf '%s\n' \
            'storePassword=ci-only-password' \
            'keyPassword=ci-only-password' \
            'keyAlias=farmora' \
            'storeFile=../ci-upload-keystore.jks' > android/key.properties

      - name: Build APK
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs="-Xmx4G
            -XX:MaxMetaspaceSize=1G
            -XX:ReservedCodeCacheSize=256m
            -XX:+HeapDumpOnOutOfMemoryError"
        run: flutter build apk --release
      - name: Build Web
        run: flutter build web --release

      - name: Deploy to Firebase Hosting & Functions
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/suka' || github.ref == 'refs/heads/dev/swami'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FARMINGAPP_24B34 }}
          projectId: farmingapp-24b34
          channelId: live
        continue-on-error: true

      - name: Deploy Firebase Rules and Functions via CLI (Fallback)
        if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev/swami') && env.FIREBASE_TOKEN != ''
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting,firestore:rules,storage --token "$FIREBASE_TOKEN" --project farmingapp-24b34

